<!-- Кадр канваса «Арка и портал». Сгенерировано scripts/extract-design.mjs из docs/design/canvas.html — не редактировать. -->
<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<title>Арка и портал</title>
<script src="8cbda03f-5483-4867-a4cf-83084f61151d"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#17141f}
.pt{position:relative;display:block}
.pt svg{display:block;overflow:visible}
.sp{display:none}
.emp{display:none}
.pt-empty .emp{display:inline}
.pt-empty .live{display:none}
@keyframes ptA{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes ptB{0%{opacity:1}12%{opacity:.4}30%{opacity:.9}41%{opacity:.3}67%{opacity:1}80%{opacity:.5}100%{opacity:1}}
@keyframes ptRise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-9px);opacity:0}}
@keyframes ptGlowC{0%,100%{filter:drop-shadow(0 0 6px #ff4466)}50%{filter:drop-shadow(0 0 28px #ff4466)}}
@keyframes ptShake{0%,100%{transform:translate(0,0)}25%{transform:translate(.5px,0)}50%{transform:translate(-.5px,.5px)}75%{transform:translate(0,-.5px)}}
@keyframes ptBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.ob{animation:ptBob 1.6s steps(1) infinite}
.pt-low{filter:drop-shadow(0 0 10px #5be0c0aa)}
.pt-low .l2{animation:ptA 4s steps(4) infinite}
.pt-low .l3{animation:ptA 4s steps(4) infinite reverse}
.pt-mid{filter:drop-shadow(0 0 12px #ffd34dbb)}
.pt-mid .l2{animation:ptB 3s steps(1) infinite}
.pt-mid .l3{animation:ptB 2.3s steps(1) infinite}
.pt-mid .s1,.pt-mid .s2{display:inline;animation:ptRise 1.8s steps(5) infinite}
.pt-high{filter:drop-shadow(0 0 16px #ff8a2bdd)}
.pt-high .l2,.pt-high .l3{animation:ptB 1.1s steps(1) infinite}
.pt-high .s1,.pt-high .s2,.pt-high .s3,.pt-high .s4{display:inline;animation:ptRise 1.2s steps(5) infinite}
.pt-crit{animation:ptGlowC .9s steps(6) infinite}
.pt-crit .shk{animation:ptShake .25s steps(1) infinite}
.pt-crit .l2,.pt-crit .l3,.pt-crit .core{animation:ptB .5s steps(1) infinite}
.pt-crit .sp{display:inline;animation:ptRise .7s steps(5) infinite}
.pt-dead{filter:grayscale(1) brightness(.75)}
.pt-empty .rn{animation:ptA 3s steps(3) infinite}
</style>
</helmet>
<div class="pt pt-{{risk}}" style="width:{{w}}px;height:{{h}}px" role="img" aria-label="{{label}}">
<svg sc-camel-view-box="0 0 24 28" width="{{w}}" height="{{h}}" shape-rendering="crispEdges" aria-hidden="true">
<g class="shk">
<path d="M6,0H18V1H20V2H21V3H22V4H23V5H24V28H0V5H1V4H2V3H3V2H4V1H6Z" fill="#3a3348"></path>
<rect x="6" y="0" width="12" height="1" fill="#6a5f80"></rect>
<rect x="4" y="1" width="2" height="1" fill="#6a5f80"></rect>
<rect x="18" y="1" width="2" height="1" fill="#2a2536"></rect>
<rect x="0" y="5" width="1" height="22" fill="#5b5068"></rect>
<rect x="23" y="5" width="1" height="22" fill="#241f30"></rect>
<rect x="11" y="0" width="2" height="2" fill="#7d7096"></rect>
<rect x="0" y="9" width="4" height="1" fill="#241f30"></rect>
<rect x="0" y="15" width="4" height="1" fill="#241f30"></rect>
<rect x="0" y="21" width="4" height="1" fill="#241f30"></rect>
<rect x="20" y="9" width="4" height="1" fill="#241f30"></rect>
<rect x="20" y="15" width="4" height="1" fill="#241f30"></rect>
<rect x="20" y="21" width="4" height="1" fill="#241f30"></rect>
<rect x="2" y="10" width="1" height="5" fill="#241f30"></rect>
<rect x="1" y="16" width="1" height="5" fill="#241f30"></rect>
<rect x="2" y="22" width="1" height="5" fill="#241f30"></rect>
<rect x="21" y="10" width="1" height="5" fill="#241f30"></rect>
<rect x="22" y="16" width="1" height="5" fill="#241f30"></rect>
<rect x="21" y="22" width="1" height="5" fill="#241f30"></rect>
<path d="M8,5H16V6H18V7H19V8H20V27H4V8H5V7H6V6H8Z" fill="{{c0}}"></path>
<g class="live">
<path class="l2" d="M9,7H15V8H17V9H18V25H6V9H7V8H9Z" fill="{{c1}}"></path>
<path class="l3" d="M10,10H14V11H15V12H16V22H8V12H9V11H10Z" fill="{{c2}}"></path>
<path class="core" d="M11,14H13V15H14V20H10V15H11Z" fill="{{c3}}"></path>
<rect x="5" y="12" width="1" height="1" fill="{{c3}}"></rect>
<rect x="18" y="17" width="1" height="1" fill="{{c3}}"></rect>
<rect x="7" y="21" width="1" height="1" fill="{{c2}}"></rect>
<rect x="16" y="11" width="1" height="1" fill="{{c2}}"></rect>
<rect class="sp s1" x="7" y="22" width="1" height="1" fill="{{c3}}" style="animation-delay:-.2s"></rect>
<rect class="sp s2" x="16" y="20" width="1" height="1" fill="{{c3}}" style="animation-delay:-.7s"></rect>
<rect class="sp s3" x="12" y="24" width="1" height="1" fill="{{c3}}" style="animation-delay:-.4s"></rect>
<rect class="sp s4" x="9" y="18" width="1" height="1" fill="{{c3}}" style="animation-delay:-1s"></rect>
<rect class="sp s5" x="14" y="16" width="1" height="1" fill="{{c3}}" style="animation-delay:-.55s"></rect>
<rect class="sp s6" x="6" y="15" width="1" height="1" fill="{{c3}}" style="animation-delay:-.1s"></rect>
</g>
<g class="emp">
<path class="rn" d="M11,10h1v5h-1z M12,11h1v1h-1z M13,12h1v1h-1z" fill="#b8742a"></path>
<path class="rn" d="M8,18h3v1h-3z M9,18h1v4h-1z" fill="#b8742a" style="animation-delay:-1s"></path>
<path class="rn" d="M14,18h1v4h-1z M15,19h1v1h-1z M15,21h1v1h-1z" fill="#b8742a" style="animation-delay:-2s"></path>
</g>
<rect x="0" y="27" width="24" height="1" fill="#17141f"></rect>
</g>
</svg>
<div style="position:absolute;left:0;right:0;bottom:{{obBottom}}px;display:flex;justify-content:center;gap:{{obGap}}px;pointer-events:none">
<sc-for list="{{obs}}" as="o" hint-placeholder-count="2">
<svg class="ob" sc-camel-view-box="-1 -1 7 10" width="{{obW}}" height="{{obH}}" shape-rendering="crispEdges" aria-hidden="true" style="flex:none;margin:0 {{obMargin}}px;animation-delay:{{o.delay}}">
<g fill="#0b0911" stroke="#0b0911" stroke-width="1.6" stroke-linejoin="miter">
<path d="M1,0h3v1h-3z M0,2h5v3h-5z M1,5h3v1h-3z"></path>
<path d="M1,6h1v2h-1z M3,6h1v2h-1z"></path>
</g>
<path d="M1,0h3v1h-3z M1,1h1v1h-1z M3,1h1v1h-1z M0,2h5v3h-5z M1,5h3v1h-3z" fill="#9bbcff"></path>
<path d="M2,1h1v1h-1z" fill="#ffe3bd"></path>
<path d="M0,4h5v1h-5z" fill="#5b75d0"></path>
<path d="M1,6h1v2h-1z M3,6h1v2h-1z" fill="#3a4a8a"></path>
</svg>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;risk&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;empty&quot;,&quot;low&quot;,&quot;mid&quot;,&quot;high&quot;,&quot;crit&quot;,&quot;dead&quot;],&quot;default&quot;:&quot;high&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;min&quot;:48,&quot;max&quot;:320},&quot;obs&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:3},&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:200}}">
class Component extends DCLogic {
  renderVals() {
    const pal = {
      low:  ['#0b3a36', '#178f80', '#5be0c0', '#d6fff3'],
      mid:  ['#3a3008', '#8f7a1c', '#ffd34d', '#fff4c2'],
      high: ['#4a1d08', '#b04a12', '#ff8a2b', '#ffe0b0'],
      crit: ['#4a0a1c', '#a31a3c', '#ff4466', '#ffd0d8'],
      dead: ['#1a1822', '#2c2a38', '#46435a', '#6a6680'],
      empty:['#0a0810', '#0a0810', '#0a0810', '#0a0810']
    };
    const names = { low: 'Портал, риск низкий', mid: 'Портал, риск средний', high: 'Портал, риск высокий', crit: 'Портал, риск критический', dead: 'Портал закрыт', empty: 'Пустая арка' };
    const risk = pal[this.props.risk] ? this.props.risk : 'high';
    const w = Number(this.props.w) || 120;
    const p = pal[risk];
    const cell = Math.max(4, Math.round(w / 17));
    const n = Math.max(0, Math.min(3, Number(this.props.obs) || 0));
    const obs = [];
    for (let i = 0; i < n; i++) obs.push({ delay: '-' + (i * 0.5) + 's' });
    return {
      risk: risk, w: w, h: Math.round(w * 28 / 24), label: names[risk],
      c0: p[0], c1: p[1], c2: p[2], c3: p[3],
      obs: obs, obW: cell * 7, obH: cell * 10, obGap: 0, obMargin: -Math.round(cell * 0.7), obBottom: -Math.round(cell * 1.6)
    };
  }
}
</script>


</body></html>
